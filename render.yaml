services:
  - type: web
    name: reminder-demo5
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGINS
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: OWNER_UIDS
        sync: false
      - key: OWNER_EMAILS
        sync: false
      - key: OWNER_LOGIN_ID
        sync: false
      - key: OWNER_PASSWORD
        sync: false
