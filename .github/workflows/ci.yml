name: CI

on:
  push:
    branches: ["main", "development", "fix/**", "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Install admin API dependencies
        run: npm ci --prefix server
      - name: Run tests
        run: npm test
      - name: Syntax-check JavaScript
        shell: bash
        run: |
          find js functions server tests -type d -name node_modules -prune -o -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Verify production bundle build
        run: node build.js
